<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Plankway – Free Daily Bridges Puzzle Game (Hashi)</title>
    <meta name="description" content="Play Plankway, a free daily bridges puzzle (Hashiwokakero). Connect the islands with bridges and mind the reefs. A new logic puzzle every day, endless mode, no download." />
    <meta name="theme-color" content="#fcf3de" />
    <!-- AdSense site verification only; the ad script itself loads after consent (src/ads/loader.ts). -->
    <meta name="google-adsense-account" content="ca-pub-1511680589185822" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Plankway" />
    <!-- Apply the saved day/night choice before the first paint (no flash). -->
    <script>
      try {
        var t = localStorage.getItem('bridgle.theme.v1');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <style>
      html { background: #fcf3de; }
      @media (prefers-color-scheme: dark) { html:not([data-theme='light']) { background: #0d1b2a; } }
      html[data-theme='dark'] { background: #0d1b2a; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Plankway needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
