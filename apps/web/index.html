<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bridgle – daily bridges puzzle</title>
    <meta name="description" content="Bridgle is a free daily bridges puzzle. Connect the islands with bridges, mind the reefs. New puzzle every day, plus endless mode." />
    <meta name="theme-color" content="#7fd1d6" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bridgle" />
    <!-- Apply the saved day/night choice before the first paint (no flash). -->
    <script>
      try {
        var t = localStorage.getItem('bridgle.theme.v1');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <style>
      html { background: #e9f6f5; }
      @media (prefers-color-scheme: dark) { html:not([data-theme='light']) { background: #0b1426; } }
      html[data-theme='dark'] { background: #0b1426; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Bridgle needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
