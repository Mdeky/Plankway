# One Worker serves both the site (static assets from apps/web/dist) and the API.
# Same origin: the profile cookie works, and no separate /api route is needed.
name = "plankway"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Custom domains: Cloudflare creates the DNS records and the certificate.
routes = [
  { pattern = "plankway.com", custom_domain = true },
  { pattern = "www.plankway.com", custom_domain = true },
]

[assets]
directory = "../web/dist"
# Every app route has its own pre-rendered HTML file (apps/web/build/prerender.ts);
# anything else gets 404.html with status 404.
not_found_handling = "404-page"
# Only API calls run the Worker code; everything else is a free static asset request.
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "plankway"
# Created with `wrangler d1 create plankway --location weur` (Western Europe).
database_id = "db8799e1-717f-49c4-ab3d-9d69ec640f8b"
migrations_dir = "migrations"

# Secrets (never in this file): `wrangler secret put HASH_PEPPER`.
# Local development reads them from .dev.vars (see .dev.vars.example).
