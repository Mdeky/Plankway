name: Generate daily puzzles

# Keeps a 14-day buffer of daily puzzles in D1. If a run fails, the buffer covers it.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: daily-puzzles
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bridgle/core test
      - name: Generate and write missing puzzles
        run: node scripts/generate-daily.ts --apply remote --days 14
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Keeps at least 500 endless levels ahead of the furthest level anyone has solved.
      - name: Top up endless levels
        run: node scripts/generate-endless.ts --apply remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
